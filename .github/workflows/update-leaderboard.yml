name: Actualizar Leaderboard Diario

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  # Permite ejecutar el proceso manualmente desde GitHub cuando quieras probarlo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia el código de tu repositorio en la máquina virtual
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configura el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instala dependencias (si tienes package.json)
      - name: Instalando dependencias
        run: npm ci || npm install

      # 4. Ejecuta tu script inyectando las variables de entorno
      - name: Ejecutar script de Leaderboard
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
        run: node script.js

      # 5. Guarda y sube las modificaciones de 'donadores.json' al repositorio
      - name: Guardar donadores.json actualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add donadores.json
          git status
          git diff-index --quiet HEAD || git commit -m "bot: actualizar donadores.json [skip ci]"
          git push
