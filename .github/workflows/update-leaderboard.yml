name: Actualizar Leaderboard Diario

on:
  schedule:
    # Se ejecuta todos los días a las 00:00 UTC
    - cron: '0 0 * * *'
  # Permite ejecutar el proceso manualmente desde GitHub cuando quieras probarlo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia el código de tu repositorio en la máquina virtual
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configura el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Instala dependencias (si tienes package.json)
      - name: Instalando dependencias
        run: npm ci || npm install

      # 4. Ejecuta tu script inyectando las variables de entorno
      #    BROADCASTER_LOGIN es una VARIABLE (no secret) del repo: Settings > Secrets and variables > Actions > Variables
      #    Si no se define, el script usa el canal dueño del token (no hace falta configurarla).
      - name: Ejecutar script de Leaderboard
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REFRESH_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN }}
          BROADCASTER_LOGIN: ${{ vars.BROADCASTER_LOGIN || '' }}
          # StreamElements (opcional): histórico EXACTO de meses y regalos.
          # Channel ID y JWT de https://streamelements.com/dashboard/account/channels
          SE_CHANNEL_ID: ${{ secrets.SE_CHANNEL_ID }}
          SE_JWT: ${{ secrets.SE_JWT }}
        run: node script.js

      # 5. Guarda y sube 'donadores.json' Y 'subs-state.json' (el estado guarda los
      #    meses acumulados y los regalos históricos: sin commitearlo se perderían).
      #    IMPORTANTE: el commit NO lleva [skip ci] — sin él, el push no dispara
      #    el workflow de Pages y la web pública se quedaría con el JSON viejo.
      - name: Guardar donadores.json y estado actualizados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add donadores.json
          # subs-state.json solo se genera en modo estimado (sin StreamElements);
          # se agrega solo si existe para no romper el modo exacto.
          if [ -f subs-state.json ]; then git add subs-state.json; fi
          git diff-index --quiet HEAD || git commit -m "bot: actualizar leaderboard y estado de subs"
          git push

      # 6. Si algo falló, dice qué secrets faltan (sin mostrar sus valores)
      - name: Diagnóstico de secrets (solo si falló)
        if: failure()
        env:
          HAY_ID: ${{ secrets.TWITCH_CLIENT_ID != '' }}
          HAY_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET != '' }}
          HAY_TOKEN: ${{ secrets.TWITCH_REFRESH_TOKEN != '' }}
        run: |
          echo "=== Diagnóstico de configuración ==="
          echo "TWITCH_CLIENT_ID definido:       $HAY_ID"
          echo "TWITCH_CLIENT_SECRET definido:   $HAY_SECRET"
          echo "TWITCH_REFRESH_TOKEN definido:   $HAY_TOKEN"
          echo ""
          echo "Si alguno dice 'false': créalo en Settings → Secrets and variables → Actions → Secrets."
          echo "Si todos dicen 'true', mira las líneas rojas del paso 'Ejecutar script de Leaderboard':"
          echo "  - 401 invalid_client  → CLIENT_ID o CLIENT_SECRET incorrectos"
          echo "  - 401 unauthorized... al refrescar → REFRESH_TOKEN revocado/expirado, regenéralo"
          echo "  - 403 en Subscriptions → al token le falta el scope channel:read:subscriptions;"
          echo "        genera el token con: bits:read channel:read:subscriptions"
