name: Actualizar Leaderboard Diario

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Actualizado para evitar warnings de deprecación

      - name: Instalando dependencias
        run: npm ci || npm install

      - name: Ejecutar script de Leaderboard
        env:
          STREAMLABS_TOKEN: ${{ secrets.STREAMLABS_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        # ⚠️ ASEGÚRATE de poner el nombre exacto de tu archivo .js aquí:
        run: node TU_ARCHIVO.js

      - name: Guardar donadores.json actualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add donadores.json
          git status
          git diff-index --quiet HEAD || git commit -m "bot: actualizar donadores.json [skip ci]"
          git push
